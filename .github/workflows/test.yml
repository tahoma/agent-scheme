name: Test

on:
  pull_request:
  push:
    branches:
      - main
  # Exhaustive opt-in lane: run the full source-metadata × docstring-retention
  # cross-product on every host and Emacs shard nightly and on demand. The
  # per-push lane (pull_request / push) trims this matrix; see the per-job
  # `if:` guards below.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

# Cancel only superseded pull-request runs: a new push to a PR coalesces onto the
# PR-numbered group and cancels the in-flight run. Pushes to main, scheduled
# runs, and manual dispatches each get a unique run-id group, so they are never
# cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The compiled and gambit-native shard targets build the non-shipped
  # host-execution test runner and run the white-box suite against the COMPILED
  # interpreter on every lane, including per-push: that compiled-interpreter
  # coverage (did gsc/raco miscompile the evaluator?) is the reason those shards
  # exist, and the interpreted hosts only cover the host-agnostic source logic, so
  # it must not be skipped. (A plain `make compile`, the install path, still does
  # not build the runner.)

jobs:
  license-reuse:
    name: REUSE / SPDX license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install REUSE
        run: pip install reuse

      - name: Check REUSE/SPDX compliance
        run: reuse lint

  lint-elisp:
    name: Emacs byte-compile lint (warnings-as-errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Byte-compile lisp/ with warnings-as-errors
        run: make lint-elisp

  lint-portable:
    name: Portable-host compiler lint (warnings-as-errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Portable twin of lint-elisp (#421): compile the host-loadable portable
    # libraries under Guile with static warnings promoted to errors. Guile is the
    # gate host because it is the only in-CI portable host with a usable `-W`
    # warning facility; it ships in the bare ubuntu-latest apt universe.
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Guile
        uses: ./.github/actions/apt-install
        with:
          packages: guile-3.0

      - name: Verify Guile
        run: guile --version

      - name: Compile portable libraries with warnings-as-errors
        run: make lint-portable

  test-portable-gambit:
    name: portable R7RS / Gambit full suite / syntax ${{ matrix.combo.source_metadata }} / docstrings ${{ matrix.combo.docstring_retention }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Gambit is the canonical portable host: on the per-push lane its full-suite
    # shard runs the canonical on/full combo plus a single fully-stripped off/none
    # de-feature smoke leg, and its recompile-bound native shard runs on/full only
    # (#481). The scheduled / workflow_dispatch lane expands both shards back to the
    # full 2×3 syntax/docstring cross-product. The reader/writer/docstring machinery
    # that axis exercises is host-independent, so the other portable hosts only run
    # the canonical combo on the per-push lane (see test-portable-extra-hosts).
    env:
      CONSENT_GAMBIT_VERSION: "4.9.7"
      CONSENT_GAMBIT_SHA256: "0da7c9772a2186dab1fba6bf6c777afe7424f40beacadf1b117d5cc825fe2db3"
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.combo.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.combo.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: ${{ matrix.combo.source_metadata == 'on' && '250000' || '' }}
      CONSENT_CI_LOG_FILE: portable-gambit-${{ matrix.combo.source_metadata }}-docstrings-${{ matrix.combo.docstring_retention }}.log
      CONSENT_CI_NATIVE_LOG_FILE: portable-gambit-native-${{ matrix.combo.source_metadata }}-docstrings-${{ matrix.combo.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: Portable R7RS Gambit full suite / source metadata ${{ matrix.combo.source_metadata }} / docstrings ${{ matrix.combo.docstring_retention }}
      CONSENT_CI_NATIVE_SHARD_SUMMARY_NAME: Portable R7RS Gambit-compiled Consent Scheme full suite / source metadata ${{ matrix.combo.source_metadata }} / docstrings ${{ matrix.combo.docstring_retention }}
    strategy:
      fail-fast: false
      # Per-push lane: canonical on/full on both shards plus a single fully-stripped
      # off/none smoke leg on the full-suite shard only (`native: false` skips the
      # recompile-bound native shard there). Scheduled / workflow_dispatch lane:
      # full 2×3 cross on both shards.
      matrix:
        combo: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[{"source_metadata":"on","docstring_retention":"full","native":true},{"source_metadata":"on","docstring_retention":"simple","native":true},{"source_metadata":"on","docstring_retention":"none","native":true},{"source_metadata":"off","docstring_retention":"full","native":true},{"source_metadata":"off","docstring_retention":"simple","native":true},{"source_metadata":"off","docstring_retention":"none","native":true}]') || fromJSON('[{"source_metadata":"on","docstring_retention":"full","native":true},{"source_metadata":"off","docstring_retention":"none","native":false}]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Gambit
        id: cache-gambit
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/gambit/${{ env.CONSENT_GAMBIT_VERSION }}
          key: ${{ runner.os }}-gambit-${{ env.CONSENT_GAMBIT_VERSION }}

      - name: Install Gambit build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox build-essential ca-certificates curl libssl-dev

      - name: Install Gambit
        run: |
          gambit_prefix="${RUNNER_TOOL_CACHE}/gambit/${CONSENT_GAMBIT_VERSION}"
          if [ ! -x "${gambit_prefix}/bin/gsi" ]; then
            curl -fsSL \
              "https://github.com/gambit/gambit/archive/refs/tags/v${CONSENT_GAMBIT_VERSION}.tar.gz" \
              -o /tmp/gambit.tar.gz
            printf '%s  %s\n' "${CONSENT_GAMBIT_SHA256}" /tmp/gambit.tar.gz | sha256sum -c -

            rm -rf /tmp/gambit-src
            mkdir -p /tmp/gambit-src "${gambit_prefix}"
            tar -xzf /tmp/gambit.tar.gz -C /tmp/gambit-src --strip-components=1
            cd /tmp/gambit-src
            ./configure --prefix="${gambit_prefix}" --enable-single-host --enable-openssl
            make -j"$(nproc)"
            make install
          fi

          echo "${gambit_prefix}/bin" >> "$GITHUB_PATH"
          "${gambit_prefix}/bin/gsi" -v
          "${gambit_prefix}/bin/gsc" -v
          "${gambit_prefix}/bin/gsi" -:r7rs -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Run portable R7RS Gambit shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-gambit 2>&1 | tee "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '"^consent-scheme-gambit-host-test-r7rs-suite$"'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      # Warm the incremental Gambit build tree. The exact key changes whenever any
      # runtime source or the compile script changes (so a content change always
      # forces the right work); the restore-keys prefix falls back to the most
      # recent tree so a normal push recompiles only the modules it touched -- in
      # the common case just the version module plus the relink. Only the
      # compiling (native) leg participates; the binary is independent of the
      # source-metadata/docstring matrix axes, so the key omits them.
      - name: Cache Gambit compiled build tree
        if: ${{ matrix.combo.native }}
        uses: actions/cache@v4
        with:
          path: build/compile/gambit
          key: ${{ runner.os }}-gambit-build-v1-${{ env.CONSENT_GAMBIT_VERSION }}-${{ hashFiles('scheme/**', 'tools/compile-portable.sh') }}
          restore-keys: |
            ${{ runner.os }}-gambit-build-v1-${{ env.CONSENT_GAMBIT_VERSION }}-

      - name: Run portable R7RS Gambit-compiled shard
        if: ${{ matrix.combo.native }}
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-gambit-native 2>&1 | tee "ci-logs/${CONSENT_CI_NATIVE_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' "${CONSENT_CI_NATIVE_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '"^consent-scheme-gambit-native-host-test-r7rs-suite$"'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_NATIVE_LOG_FILE}"
          exit "$status"

      - name: Upload portable Gambit shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-gambit-${{ matrix.combo.source_metadata }}-docstrings-${{ matrix.combo.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Upload portable Gambit-compiled shard log
        if: ${{ always() && matrix.combo.native }}
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-gambit-native-${{ matrix.combo.source_metadata }}-docstrings-${{ matrix.combo.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_NATIVE_LOG_FILE }}
          if-no-files-found: warn

      - name: Render portable Gambit shard timing summary
        if: always()
        shell: bash
        run: |
          logs=()
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            logs+=("ci-logs/${CONSENT_CI_LOG_FILE}")
          fi
          if [ -f "ci-logs/${CONSENT_CI_NATIVE_LOG_FILE}" ]; then
            logs+=("ci-logs/${CONSENT_CI_NATIVE_LOG_FILE}")
          fi
          if [ "${#logs[@]}" -gt 0 ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'consent-ci)" \
              --funcall consent-ci-summary-batch-main -- "${logs[@]}"
          fi

  test-portable-extra-hosts:
    name: portable R7RS / ${{ matrix.host.host_name }} full suite / syntax ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Pull the base image from the rate-limit-free AWS ECR Public Ubuntu mirror
    # instead of Docker Hub (registry-1.docker.io), whose anonymous per-IP limit
    # intermittently times this container job out at provisioning. Same Ubuntu
    # 26.04 image, so interpreter versions are unchanged.
    container: public.ecr.aws/ubuntu/ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: ${{ matrix.source_metadata == 'on' && '250000' || '' }}
      CONSENT_CI_LOG_FILE: portable-${{ matrix.host.host }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: ${{ matrix.host.summary_name }} / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      # Per-push lane runs every extra host on the canonical on/full combo only;
      # the scheduled / workflow_dispatch lane expands to the full 2×3 cross.
      # Gambit (test-portable-gambit) carries the full portable cross on every
      # lane, so the host-independent metadata/docstring axis stays covered.
      matrix:
        source_metadata: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["on", "off"]') || fromJSON('["on"]') }}
        docstring_retention: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["full", "simple", "none"]') || fromJSON('["full"]') }}
        host:
          - host: racket
            host_name: Racket
            apt_package: racket
            make_target: test-portable-racket
            summary_name: Portable R7RS Racket full suite
            selector: '"^consent-scheme-racket-host-test-r7rs-suite$"'
          - host: compiled
            host_name: Racket-compiled Consent Scheme
            apt_package: racket
            make_target: test-portable-compiled
            summary_name: Portable R7RS Racket-compiled Consent Scheme full suite
            selector: '"^consent-scheme-compiled-host-test-r7rs-suite$"'
          - host: guile
            host_name: Guile
            apt_package: guile-3.0
            make_target: test-portable-guile
            summary_name: Portable R7RS Guile full suite
            selector: '"^consent-scheme-guile-host-test-r7rs-suite$"'
          - host: gauche
            host_name: Gauche
            apt_package: gauche
            make_target: test-portable-gauche
            summary_name: Portable R7RS Gauche full suite
            selector: '"^consent-scheme-gauche-host-test-r7rs-suite$"'

    steps:
      - name: Install checkout tools
        shell: bash
        run: |
          run() { timeout 180 "$@"; }
          ok=0
          for attempt in 1 2 3 4; do
            if run apt-get update -o Acquire::Retries=3 \
               && run apt-get install -y --no-install-recommends -o Acquire::Retries=3 ca-certificates git tar zstd; then
              ok=1
              break
            fi
            echo "::warning::apt attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 10))
          done
          [ "${ok}" -eq 1 ] || { echo "::error::apt failed after retries" >&2; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Racket R7RS package
        if: matrix.host.host == 'racket' || matrix.host.host == 'compiled'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/racket
            ~/.cache/racket
          key: ${{ runner.os }}-racket-r7rs-v1

      # Warm the Racket compiled build tree (collection sources plus the bytecode
      # raco make writes under their compiled/ directories). write-if-changed
      # generation keeps unchanged sources' timestamps stable, so a restore lets
      # raco make recompile only the modules that actually changed before raco exe
      # links from the reused bytecode. Only the Racket-compiled host builds it.
      - name: Cache Racket compiled build tree
        if: matrix.host.host == 'compiled'
        uses: actions/cache@v4
        with:
          path: build/compile/racket
          key: ${{ runner.os }}-racket-build-v1-${{ hashFiles('scheme/**', 'tools/compile-portable.sh') }}
          restore-keys: |
            ${{ runner.os }}-racket-build-v1-

      - name: Install portable R7RS host
        uses: ./.github/actions/apt-install
        with:
          packages: make emacs-nox ${{ matrix.host.apt_package }}

      - name: Verify portable R7RS host
        shell: bash
        run: |
          case "${{ matrix.host.host }}" in
            racket|compiled)
              raco pkg install --batch --auto --skip-installed --no-docs r7rs
              racket -I r7rs -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'
              ;;
            guile)
              guile --no-auto-compile --r7rs -c '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'
              ;;
            gauche)
              gosh -r7 -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'
              ;;
          esac

      - name: Run portable R7RS host shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make "${{ matrix.host.make_target }}" 2>&1 | tee "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '${{ matrix.host.selector }}'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload portable R7RS host shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-${{ matrix.host.host }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render portable R7RS host shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'consent-ci)" \
              --eval "(consent-ci-write-summary (list (expand-file-name (getenv \"CONSENT_CI_LOG_FILE\") \"ci-logs\")) (getenv \"GITHUB_STEP_SUMMARY\"))"
          fi

  test-emacs-hosted:
    name: Emacs-hosted ERT (${{ matrix.shard.label }}; syntax ${{ matrix.source_metadata }}; docstrings ${{ matrix.docstring_retention }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: ${{ matrix.source_metadata == 'on' && '250000' || '' }}
      CONSENT_CI_LOG_FILE: emacs-${{ matrix.shard.shard }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: ${{ matrix.shard.summary_name }} / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      # Per-push lane runs the library, agent/capability, tools, integration,
      # and native-build shards on the canonical on/full combo only; the
      # scheduled / workflow_dispatch lane expands to the full 2×3 cross. The
      # core language/runtime shard carries the full Emacs cross on every lane
      # in its own job (test-emacs-core).
      matrix:
        source_metadata: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["on", "off"]') || fromJSON('["on"]') }}
        docstring_retention: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["full", "simple", "none"]') || fromJSON('["full"]') }}
        shard:
          - shard: emacs-library
            label: library/conformance
            make_target: test-emacs-library
            summary_name: Emacs library/conformance
            selector: '(or "consent-conformance.*" "consent-fixture.*" "consent-host-adapter-fixture.*" "consent-library.*" "consent-oracle.*")'
          # The agent/capability surface used to run as one capabilities/policy
          # shard. It dominated per-push wall time, so the default lane splits
          # it into behavior-focused shards that can run in parallel.
          - shard: emacs-agent-control
            label: agent control
            make_target: test-emacs-agent-control
            summary_name: Emacs agent control
            selector: '(or "consent-agent-prompt.*" "consent-agent-proposal.*" "consent-agent-registry.*" "consent-task.*")'
          - shard: emacs-agent-reliability
            label: agent reliability
            make_target: test-emacs-agent-reliability
            summary_name: Emacs agent reliability
            selector: '(or "consent-agent-reliability.*" "consent-agent-runner.*")'
          - shard: emacs-capability-boundary
            label: capability boundary
            make_target: test-emacs-capability-boundary
            summary_name: Emacs capability boundary
            selector: '(or "consent-approval.*" "consent-capability.*" "consent-network.*" "consent-policy.*")'
          - shard: emacs-agent-state
            label: agent state
            make_target: test-emacs-agent-state
            summary_name: Emacs agent state
            selector: '(or "consent-agent-io.*" "consent-context.*" "consent-helper.*" "consent-memory.*" "consent-models.*" "consent-plan.*" "consent-redaction.*" "consent-session.*" "consent-test.*" "consent-transcript.*")'
          # #556 split the heavyweight Emacs-hosted integration surface (REPL,
          # VCS, reflect, native-CLI daemon) out of the tools shard into
          # test-emacs-integration, and stranded the four full host-compile +
          # install/dist tests into test-emacs-native-build. The tools shard's
          # summary_name is left format-stable per the #404/#520 stability
          # constraint even though its content narrowed; the integration and
          # native-build shards get their own new summary names below.
          - shard: emacs-tools
            label: tools/docs/integration
            make_target: test-emacs-tools
            summary_name: Emacs tools/docs/integration
            selector: '(and (or "consent-ci.*" "consent-compile.*" "consent-control-loop-doc.*" "consent-debugger.*" "consent-diagnostics.*" "consent-diff.*" "consent-feature-reflection-doc.*" "consent-job.*" "consent-skill.*" "consent-smoke.*" "consent-scheme-documentation-test-.*" "consent-scheme-module-ownership-test-.*" "^consent-scheme-eval-test-bootstrap-avoids-host-call/cc$" "^consent-scheme-module-boundary-test-runtime-version-loads-outside-repo$") (not "^consent-compile-portable-test-\(racket\|gambit\)-\(builds-runner\|install-and-dist\)$"))'
          - shard: emacs-integration
            label: integration/REPL
            make_target: test-emacs-integration
            summary_name: Emacs integration/REPL
            selector: '(or "consent-native-cli-daemon.*" "consent-reflect.*" "consent-repl.*" "consent-vcs.*")'
          # The native-build shard isolates the four full host-compile +
          # install/dist tests so they only run in `make test-full' locally
          # (#556). On CI's emacs-hosted runners neither gsc/gsi nor raco/racket
          # is installed, so the four tests skip; the shard is still included
          # so the matrix mirrors `make test-full' and so the install/dist
          # capability surface re-runs once a compiler is provisioned in this
          # job. The non-build tests in `consent-compile-portable-test.el'
          # (rejects-unknown-host, *-missing-tools-fail,
          # install-without-binary-fails) remain in the tools shard above.
          - shard: emacs-native-build
            label: native-build/install-dist
            make_target: test-emacs-native-build
            summary_name: Emacs native-build/install-dist
            selector: '"^consent-compile-portable-test-\(racket\|gambit\)-\(builds-runner\|install-and-dist\)$"'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Run Emacs-hosted ERT shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make "${{ matrix.shard.make_target }}" 2>&1 | tee "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '${{ matrix.shard.selector }}'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload Emacs-hosted shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.shard.shard }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render Emacs-hosted shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'consent-ci)" \
              --eval "(consent-ci-write-summary (list (expand-file-name (getenv \"CONSENT_CI_LOG_FILE\") \"ci-logs\")) (getenv \"GITHUB_STEP_SUMMARY\"))"
          fi

  test-emacs-core:
    name: Emacs-hosted ERT (${{ matrix.shard.label }}; syntax ${{ matrix.combo.source_metadata }}; docstrings ${{ matrix.combo.docstring_retention }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Canonical Emacs shard: on the per-push lane the core language/runtime shard
    # runs the canonical on/full combo plus a single fully-stripped off/none
    # de-feature smoke leg, so the Emacs reader/writer/docstring axis keeps a fast
    # per-push canary (#481). The scheduled / workflow_dispatch lane expands it back
    # to the full 2×3 syntax/docstring cross-product. The non-core Emacs shards
    # trim to the canonical combo on the per-push lane (see test-emacs-hosted).
    env:
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.combo.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.combo.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: ${{ matrix.combo.source_metadata == 'on' && '250000' || '' }}
      CONSENT_CI_LOG_FILE: emacs-${{ matrix.shard.shard }}-${{ matrix.combo.source_metadata }}-docstrings-${{ matrix.combo.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: ${{ matrix.shard.summary_name }} / source metadata ${{ matrix.combo.source_metadata }} / docstrings ${{ matrix.combo.docstring_retention }}
    strategy:
      fail-fast: false
      # Per-push lane: canonical on/full plus a single fully-stripped off/none smoke
      # leg. Scheduled / workflow_dispatch lane: full 2×3 cross.
      matrix:
        combo: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[{"source_metadata":"on","docstring_retention":"full"},{"source_metadata":"on","docstring_retention":"simple"},{"source_metadata":"on","docstring_retention":"none"},{"source_metadata":"off","docstring_retention":"full"},{"source_metadata":"off","docstring_retention":"simple"},{"source_metadata":"off","docstring_retention":"none"}]') || fromJSON('[{"source_metadata":"on","docstring_retention":"full"},{"source_metadata":"off","docstring_retention":"none"}]') }}
        shard:
          - shard: emacs-core
            label: core language/runtime
            make_target: test-emacs-core
            summary_name: Emacs core language/runtime
            selector: '(or "consent-base.*" "consent-eval.*" "consent-interpreter-module.*" "consent-macro.*" "consent-reader.*" "consent-result.*" "consent-runtime.*")'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Run Emacs-hosted ERT shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make "${{ matrix.shard.make_target }}" 2>&1 | tee "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '${{ matrix.shard.selector }}'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload Emacs-hosted shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.shard.shard }}-${{ matrix.combo.source_metadata }}-docstrings-${{ matrix.combo.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render Emacs-hosted shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'consent-ci)" \
              --eval "(consent-ci-write-summary (list (expand-file-name (getenv \"CONSENT_CI_LOG_FILE\") \"ci-logs\")) (getenv \"GITHUB_STEP_SUMMARY\"))"
          fi

  test-parity:
    name: Emacs/portable parity gate (syntax ${{ matrix.source_metadata }}; docstrings ${{ matrix.docstring_retention }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required cross-implementation gate (#374): run the shared fixture corpus
    # through both in-repo cores -- the Emacs-hosted implementation and the
    # portable R7RS implementation, exercised here under Guile -- and fail on
    # any result divergence. The per-push lane runs the canonical on/full combo;
    # the scheduled / workflow_dispatch lane expands to the full 2x3 cross, since
    # each core's own shards already carry the metadata/docstring axis. Guile is
    # the parity host here because it ships in the bare ubuntu-latest runner's
    # apt universe; gauche is only packaged in the ubuntu:26.04 container the
    # other portable-host shards run in.
    env:
      CONSENT_PARITY_HOST: guile
      CONSENT_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      CONSENT_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      CONSENT_TEST_MAX_SOURCE_METADATA: ${{ matrix.source_metadata == 'on' && '250000' || '' }}
      CONSENT_CI_LOG_FILE: parity-guile-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      CONSENT_CI_SHARD_SUMMARY_NAME: Emacs/portable parity gate / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        source_metadata: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["on", "off"]') || fromJSON('["on"]') }}
        docstring_retention: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["full", "simple", "none"]') || fromJSON('["full"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs and Guile
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox guile-3.0

      - name: Verify Guile
        run: |
          guile --no-auto-compile --r7rs -L scheme \
            -c '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Run Emacs/portable parity gate
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-parity 2>&1 | tee "ci-logs/${CONSENT_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'CONSENT_CI_SHARD_NAME=%s\n' "${CONSENT_CI_SHARD_SUMMARY_NAME}"
            printf 'CONSENT_CI_SHARD_SELECTOR=%s\n' '"^consent-parity-test-.*"'
            printf 'CONSENT_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${CONSENT_CI_LOG_FILE}"
          exit "$status"

      - name: Upload parity gate shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-parity-guile-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.CONSENT_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render parity gate shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${CONSENT_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'consent-ci)" \
              --eval "(consent-ci-write-summary (list (expand-file-name (getenv \"CONSENT_CI_LOG_FILE\") \"ci-logs\")) (getenv \"GITHUB_STEP_SUMMARY\"))"
          fi

  test-summary:
    name: test shard timing summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - test-portable-gambit
      - test-portable-extra-hosts
      - test-emacs-hosted
      - test-emacs-core
      - test-parity
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        uses: ./.github/actions/apt-install
        with:
          packages: emacs-nox

      - name: Download shard logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-log-*
          path: ci-logs
          merge-multiple: true

      - name: Render combined timing summary
        shell: bash
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n' 'No shard logs were available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary_file=ci-logs/test-shard-summary.md
          : > "$summary_file"
          CONSENT_CI_SUMMARY_FILE="$summary_file" emacs -Q --batch -L lisp \
            --eval "(require 'consent-ci)" \
            --funcall consent-ci-summary-batch-main -- "${logs[@]}"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      # Structured, append-only per-run record for longitudinal analysis (#465).
      # Extends the consent-ci summary path over the same shard logs; the record
      # is JSON Lines tagged with schema_version. The durable sink is a
      # long-retention artifact for now; a queryable orphan-branch sink is
      # tracked as a follow-up. See docs/ci-run-record.md.
      - name: Emit per-run CI record
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSENT_CI_PARITY_RESULT: ${{ needs.test-parity.result }}
          CONSENT_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONSENT_CI_PR_NUMBER: ${{ github.event.pull_request.number }}
          CONSENT_CI_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          CONSENT_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONSENT_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n' 'No shard logs were available; skipping per-run record.'
            exit 0
          fi
          CONSENT_CI_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CONSENT_CI_TIMESTAMP
          # Change scope comes from the PR API (history-independent here, since
          # the summary job only checks out the merge commit). Null on push /
          # schedule lanes, which have no pull request to size.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${CONSENT_CI_PR_NUMBER}" ]; then
            if scope="$(gh pr view "${CONSENT_CI_PR_NUMBER}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --json files,changedFiles,additions,deletions 2>/dev/null)"; then
              CONSENT_CI_CHANGED_FILES="$(printf '%s' "$scope" | jq -r '.changedFiles')"
              CONSENT_CI_INSERTIONS="$(printf '%s' "$scope" | jq -r '.additions')"
              CONSENT_CI_DELETIONS="$(printf '%s' "$scope" | jq -r '.deletions')"
              export CONSENT_CI_CHANGED_FILES CONSENT_CI_INSERTIONS CONSENT_CI_DELETIONS
              if printf '%s' "$scope" \
                  | jq -e '.files[] | select(.path == "scheme/consent/version.sld")' >/dev/null; then
                export CONSENT_CI_VERSION_CHANGED=true
              else
                export CONSENT_CI_VERSION_CHANGED=false
              fi
            fi
          fi
          CONSENT_CI_RUN_RECORD_FILE=ci-logs/run-record.jsonl emacs -Q --batch -L lisp \
            --eval "(require 'consent-ci)" \
            --funcall consent-ci-run-record-batch-main -- "${logs[@]}"
          printf 'Wrote per-run CI record:\n'
          cat ci-logs/run-record.jsonl

      - name: Upload per-run CI record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-run-record
          path: ci-logs/run-record.jsonl
          retention-days: 90
          if-no-files-found: ignore

      - name: Prepare pull request timing comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CONSENT_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n\n%s\n' '<!-- consent-ci-timing-summary -->' 'No shard logs were available.' > ci-logs/pr-timing-summary.md
            exit 0
          fi
          CONSENT_CI_PR_SUMMARY_FILE=ci-logs/pr-timing-summary.md emacs -Q --batch -L lisp \
            --eval "(require 'consent-ci)" \
            --funcall consent-ci-pr-summary-batch-main -- "${logs[@]}"

      - name: Publish pull request timing comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- consent-ci-timing-summary -->'
          comment_file=ci-logs/pr-timing-summary.md
          if [ ! -s "$comment_file" ]; then
            printf '%s\n\nNo shard timing summary was available.' "$marker" > "$comment_file"
          fi
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${CONSENT_PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- consent-ci-timing-summary -->")) | .id' \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --field "body=@${comment_file}" \
              --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${CONSENT_PR_NUMBER}/comments" \
              --field "body=@${comment_file}" \
              --silent
          fi

  live-local-model:
    name: live local model smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CONSENT_LIVE_MODEL_ENDPOINT: http://127.0.0.1:11434/v1
      CONSENT_LIVE_MODEL_ID: qwen3:0.6b
      OLLAMA_VERSION: 0.24.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: ca-certificates curl emacs-nox make racket zstd

      - name: Cache Racket R7RS package
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/racket
            ~/.cache/racket
          key: ${{ runner.os }}-racket-r7rs-v1

      - name: Cache Racket compiled build tree
        uses: actions/cache@v4
        with:
          path: build/compile/racket
          key: ${{ runner.os }}-racket-build-v1-${{ hashFiles('scheme/**', 'tools/compile-portable.sh') }}
          restore-keys: |
            ${{ runner.os }}-racket-build-v1-

      - name: Verify Racket host
        run: |
          raco pkg install --batch --auto --skip-installed --no-docs r7rs
          racket -I r7rs -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Cache Ollama models
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-qwen3-06b-v1

      - name: Install Ollama
        run: |
          curl -fsSL "https://ollama.com/download/ollama-linux-amd64.tar.zst?version=${OLLAMA_VERSION}" \
            | zstd -d \
            | sudo tar -xf - -C /usr/local
          ollama --version

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull smoke model
        run: ollama pull "$CONSENT_LIVE_MODEL_ID"

      - name: Run live local model smoke
        run: make test-live-model-ci

      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log
