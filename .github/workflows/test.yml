name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-portable-gambit:
    name: portable R7RS / Gambit full suite / syntax ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    runs-on: ubuntu-latest
    env:
      AGENT_SCHEME_GAMBIT_VERSION: "4.9.7"
      AGENT_SCHEME_GAMBIT_SHA256: "0da7c9772a2186dab1fba6bf6c777afe7424f40beacadf1b117d5cc825fe2db3"
      AGENT_SCHEME_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      AGENT_SCHEME_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      AGENT_SCHEME_CI_LOG_FILE: portable-gambit-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      AGENT_SCHEME_CI_NATIVE_LOG_FILE: portable-gambit-native-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      AGENT_SCHEME_CI_SHARD_SUMMARY_NAME: Portable R7RS Gambit full suite / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
      AGENT_SCHEME_CI_NATIVE_SHARD_SUMMARY_NAME: Portable R7RS Gambit native Agent Scheme full suite / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        source_metadata: ["on", "off"]
        docstring_retention: ["full", "simple", "none"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Gambit
        id: cache-gambit
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/gambit/${{ env.AGENT_SCHEME_GAMBIT_VERSION }}
          key: ${{ runner.os }}-gambit-${{ env.AGENT_SCHEME_GAMBIT_VERSION }}

      - name: Install Gambit
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox build-essential ca-certificates curl libssl-dev

          gambit_prefix="${RUNNER_TOOL_CACHE}/gambit/${AGENT_SCHEME_GAMBIT_VERSION}"
          if [ ! -x "${gambit_prefix}/bin/gsi" ]; then
            curl -fsSL \
              "https://github.com/gambit/gambit/archive/refs/tags/v${AGENT_SCHEME_GAMBIT_VERSION}.tar.gz" \
              -o /tmp/gambit.tar.gz
            printf '%s  %s\n' "${AGENT_SCHEME_GAMBIT_SHA256}" /tmp/gambit.tar.gz | sha256sum -c -

            rm -rf /tmp/gambit-src
            mkdir -p /tmp/gambit-src "${gambit_prefix}"
            tar -xzf /tmp/gambit.tar.gz -C /tmp/gambit-src --strip-components=1
            cd /tmp/gambit-src
            ./configure --prefix="${gambit_prefix}" --enable-single-host --enable-openssl
            make -j"$(nproc)"
            make install
          fi

          echo "${gambit_prefix}/bin" >> "$GITHUB_PATH"
          "${gambit_prefix}/bin/gsi" -v
          "${gambit_prefix}/bin/gsc" -v
          "${gambit_prefix}/bin/gsi" -:r7rs -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'

      - name: Run portable R7RS Gambit shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-gambit 2>&1 | tee "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'AGENT_SCHEME_CI_SHARD_NAME=%s\n' "${AGENT_SCHEME_CI_SHARD_SUMMARY_NAME}"
            printf 'AGENT_SCHEME_CI_SHARD_SELECTOR=%s\n' '"^agent-scheme-scheme-gambit-host-test-r7rs-suite$"'
            printf 'AGENT_SCHEME_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          exit "$status"

      - name: Run portable R7RS Gambit native shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-gambit-native 2>&1 | tee "ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'AGENT_SCHEME_CI_SHARD_NAME=%s\n' "${AGENT_SCHEME_CI_NATIVE_SHARD_SUMMARY_NAME}"
            printf 'AGENT_SCHEME_CI_SHARD_SELECTOR=%s\n' '"^agent-scheme-scheme-gambit-native-host-test-r7rs-suite$"'
            printf 'AGENT_SCHEME_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}"
          exit "$status"

      - name: Upload portable Gambit shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-gambit-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.AGENT_SCHEME_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Upload portable Gambit native shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-gambit-native-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.AGENT_SCHEME_CI_NATIVE_LOG_FILE }}
          if-no-files-found: warn

      - name: Render portable Gambit shard timing summary
        if: always()
        shell: bash
        run: |
          logs=()
          if [ -f "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}" ]; then
            logs+=("ci-logs/${AGENT_SCHEME_CI_LOG_FILE}")
          fi
          if [ -f "ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}" ]; then
            logs+=("ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}")
          fi
          if [ "${#logs[@]}" -gt 0 ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'agent-scheme-ci)" \
              --funcall agent-scheme-ci-summary-batch-main -- "${logs[@]}"
          fi

  test-portable-cyclone:
    name: portable R7RS / Cyclone full suite / syntax ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    runs-on: ubuntu-latest
    env:
      AGENT_SCHEME_CYCLONE_BOOTSTRAP_REF: master
      AGENT_SCHEME_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      AGENT_SCHEME_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      AGENT_SCHEME_CI_LOG_FILE: portable-cyclone-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      AGENT_SCHEME_CI_NATIVE_LOG_FILE: portable-cyclone-native-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      AGENT_SCHEME_CI_SHARD_SUMMARY_NAME: Portable R7RS Cyclone full suite / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
      AGENT_SCHEME_CI_NATIVE_SHARD_SUMMARY_NAME: Portable R7RS Cyclone native Agent Scheme full suite / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        source_metadata: ["on", "off"]
        docstring_retention: ["full", "simple", "none"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Cyclone
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/cyclone/${{ env.AGENT_SCHEME_CYCLONE_BOOTSTRAP_REF }}
          key: ${{ runner.os }}-cyclone-bootstrap-${{ env.AGENT_SCHEME_CYCLONE_BOOTSTRAP_REF }}-v1

      - name: Install Cyclone
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox build-essential ca-certificates git libck-dev

          cyclone_prefix="${RUNNER_TOOL_CACHE}/cyclone/${AGENT_SCHEME_CYCLONE_BOOTSTRAP_REF}"
          if [ ! -x "${cyclone_prefix}/bin/icyc" ] || [ ! -x "${cyclone_prefix}/bin/cyclone" ]; then
            rm -rf /tmp/cyclone-bootstrap
            git clone --depth 1 --branch "${AGENT_SCHEME_CYCLONE_BOOTSTRAP_REF}" \
              https://github.com/justinethier/cyclone-bootstrap.git \
              /tmp/cyclone-bootstrap
            make -C /tmp/cyclone-bootstrap PREFIX="${cyclone_prefix}"
            make -C /tmp/cyclone-bootstrap PREFIX="${cyclone_prefix}" install
          fi

          echo "${cyclone_prefix}/bin" >> "$GITHUB_PATH"
          export PATH="${cyclone_prefix}/bin:${PATH}"
          icyc -I scheme -p "(+ 1 2)"
          cyclone -vn

      - name: Run portable R7RS Cyclone shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-cyclone 2>&1 | tee "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'AGENT_SCHEME_CI_SHARD_NAME=%s\n' "${AGENT_SCHEME_CI_SHARD_SUMMARY_NAME}"
            printf 'AGENT_SCHEME_CI_SHARD_SELECTOR=%s\n' '"^agent-scheme-scheme-cyclone-host-test-r7rs-suite$"'
            printf 'AGENT_SCHEME_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          exit "$status"

      - name: Run portable R7RS Cyclone native shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make test-portable-cyclone-native 2>&1 | tee "ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'AGENT_SCHEME_CI_SHARD_NAME=%s\n' "${AGENT_SCHEME_CI_NATIVE_SHARD_SUMMARY_NAME}"
            printf 'AGENT_SCHEME_CI_SHARD_SELECTOR=%s\n' '"^agent-scheme-scheme-cyclone-native-host-test-r7rs-suite$"'
            printf 'AGENT_SCHEME_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}"
          exit "$status"

      - name: Upload portable Cyclone shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-cyclone-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.AGENT_SCHEME_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Upload portable Cyclone native shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-cyclone-native-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.AGENT_SCHEME_CI_NATIVE_LOG_FILE }}
          if-no-files-found: warn

      - name: Render portable Cyclone shard timing summary
        if: always()
        shell: bash
        run: |
          logs=()
          if [ -f "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}" ]; then
            logs+=("ci-logs/${AGENT_SCHEME_CI_LOG_FILE}")
          fi
          if [ -f "ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}" ]; then
            logs+=("ci-logs/${AGENT_SCHEME_CI_NATIVE_LOG_FILE}")
          fi
          if [ "${#logs[@]}" -gt 0 ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'agent-scheme-ci)" \
              --funcall agent-scheme-ci-summary-batch-main -- "${logs[@]}"
          fi

  test-portable-extra-hosts:
    name: portable R7RS / ${{ matrix.host.host_name }} full suite / syntax ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      AGENT_SCHEME_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      AGENT_SCHEME_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      AGENT_SCHEME_CI_LOG_FILE: portable-${{ matrix.host.host }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      AGENT_SCHEME_CI_SHARD_SUMMARY_NAME: ${{ matrix.host.summary_name }} / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        source_metadata: ["on", "off"]
        docstring_retention: ["full", "simple", "none"]
        host:
          - host: racket
            host_name: Racket
            apt_package: racket
            make_target: test-portable-racket
            summary_name: Portable R7RS Racket full suite
            selector: '"^agent-scheme-scheme-racket-host-test-r7rs-suite$"'
          - host: compiled
            host_name: Compiled Agent Scheme
            apt_package: racket
            make_target: test-portable-compiled
            summary_name: Portable R7RS Compiled Agent Scheme full suite
            selector: '"^agent-scheme-scheme-compiled-host-test-r7rs-suite$"'
          - host: guile
            host_name: Guile
            apt_package: guile-3.0
            make_target: test-portable-guile
            summary_name: Portable R7RS Guile full suite
            selector: '"^agent-scheme-scheme-guile-host-test-r7rs-suite$"'
          - host: gauche
            host_name: Gauche
            apt_package: gauche
            make_target: test-portable-gauche
            summary_name: Portable R7RS Gauche full suite
            selector: '"^agent-scheme-scheme-gauche-host-test-r7rs-suite$"'

    steps:
      - name: Install checkout tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y ca-certificates git tar zstd

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Racket R7RS package
        if: matrix.host.host == 'racket' || matrix.host.host == 'compiled'
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/racket
            ~/.cache/racket
          key: ${{ runner.os }}-racket-r7rs-v1

      - name: Install portable R7RS host
        shell: bash
        run: |
          apt-get install -y make emacs-nox "${{ matrix.host.apt_package }}"

          case "${{ matrix.host.host }}" in
            racket|compiled)
              raco pkg install --batch --auto --skip-installed --no-docs r7rs
              racket -I r7rs -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'
              ;;
            guile)
              guile --no-auto-compile --r7rs -c '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'
              ;;
            gauche)
              gosh -r7 -e '(import (scheme base) (scheme write)) (write (+ 1 2)) (newline)'
              ;;
          esac

      - name: Run portable R7RS host shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make "${{ matrix.host.make_target }}" 2>&1 | tee "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'AGENT_SCHEME_CI_SHARD_NAME=%s\n' "${AGENT_SCHEME_CI_SHARD_SUMMARY_NAME}"
            printf 'AGENT_SCHEME_CI_SHARD_SELECTOR=%s\n' '${{ matrix.host.selector }}'
            printf 'AGENT_SCHEME_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          exit "$status"

      - name: Upload portable R7RS host shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-portable-${{ matrix.host.host }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.AGENT_SCHEME_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render portable R7RS host shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'agent-scheme-ci)" \
              --eval "(agent-scheme-ci-write-summary (list (expand-file-name (getenv \"AGENT_SCHEME_CI_LOG_FILE\") \"ci-logs\")) (getenv \"GITHUB_STEP_SUMMARY\"))"
          fi

  test-emacs-hosted:
    name: Emacs-hosted ERT (${{ matrix.shard.label }}; syntax ${{ matrix.source_metadata }}; docstrings ${{ matrix.docstring_retention }})
    runs-on: ubuntu-latest
    env:
      AGENT_SCHEME_TEST_SOURCE_METADATA: ${{ matrix.source_metadata }}
      AGENT_SCHEME_TEST_DOCSTRING_RETENTION: ${{ matrix.docstring_retention }}
      AGENT_SCHEME_CI_LOG_FILE: emacs-${{ matrix.shard.shard }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}.log
      AGENT_SCHEME_CI_SHARD_SUMMARY_NAME: ${{ matrix.shard.summary_name }} / source metadata ${{ matrix.source_metadata }} / docstrings ${{ matrix.docstring_retention }}
    strategy:
      fail-fast: false
      matrix:
        source_metadata: ["on", "off"]
        docstring_retention: ["full", "simple", "none"]
        shard:
          - shard: emacs-core
            label: core language/runtime
            make_target: test-emacs-core
            summary_name: Emacs core language/runtime
            selector: '(or "agent-scheme-base.*" "agent-scheme-eval.*" "agent-scheme-interpreter-module.*" "agent-scheme-macro.*" "agent-scheme-reader.*" "agent-scheme-result.*" "agent-scheme-runtime.*")'
          - shard: emacs-library
            label: library/conformance
            make_target: test-emacs-library
            summary_name: Emacs library/conformance
            selector: '(or "agent-scheme-conformance.*" "agent-scheme-fixture.*" "agent-scheme-host-adapter-fixture.*" "agent-scheme-library.*" "agent-scheme-oracle.*")'
          - shard: emacs-capabilities
            label: capabilities/policy
            make_target: test-emacs-capabilities
            summary_name: Emacs capabilities/policy
            selector: '(or "agent-scheme-agent-io.*" "agent-scheme-approval.*" "agent-scheme-capability.*" "agent-scheme-context.*" "agent-scheme-memory.*" "agent-scheme-models.*" "agent-scheme-network.*" "agent-scheme-policy.*" "agent-scheme-redaction.*" "agent-scheme-session.*")'
          - shard: emacs-tools
            label: tools/docs/integration
            make_target: test-emacs-tools
            summary_name: Emacs tools/docs/integration
            selector: '(or "agent-scheme-ci.*" "agent-scheme-compile.*" "agent-scheme-control-loop-doc.*" "agent-scheme-debugger.*" "agent-scheme-diagnostics.*" "agent-scheme-diff.*" "agent-scheme-feature-reflection-doc.*" "agent-scheme-job.*" "agent-scheme-native-cli-daemon-doc.*" "agent-scheme-reflect.*" "agent-scheme-repl.*" "agent-scheme-skill.*" "agent-scheme-smoke.*" "agent-scheme-vcs.*")'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Run Emacs-hosted ERT shard
        shell: bash
        run: |
          mkdir -p ci-logs
          started=$SECONDS
          set +e
          make "${{ matrix.shard.make_target }}" 2>&1 | tee "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          status=${PIPESTATUS[0]}
          wall=$((SECONDS - started))
          {
            printf 'AGENT_SCHEME_CI_SHARD_NAME=%s\n' "${AGENT_SCHEME_CI_SHARD_SUMMARY_NAME}"
            printf 'AGENT_SCHEME_CI_SHARD_SELECTOR=%s\n' '${{ matrix.shard.selector }}'
            printf 'AGENT_SCHEME_CI_WALL_SECONDS=%s\n' "$wall"
          } >> "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}"
          exit "$status"

      - name: Upload Emacs-hosted shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.shard.shard }}-${{ matrix.source_metadata }}-docstrings-${{ matrix.docstring_retention }}
          path: ci-logs/${{ env.AGENT_SCHEME_CI_LOG_FILE }}
          if-no-files-found: warn

      - name: Render Emacs-hosted shard timing summary
        if: always()
        run: |
          if [ -f "ci-logs/${AGENT_SCHEME_CI_LOG_FILE}" ]; then
            emacs -Q --batch -L lisp \
              --eval "(require 'agent-scheme-ci)" \
              --eval "(agent-scheme-ci-write-summary (list (expand-file-name (getenv \"AGENT_SCHEME_CI_LOG_FILE\") \"ci-logs\")) (getenv \"GITHUB_STEP_SUMMARY\"))"
          fi

  test-summary:
    name: test shard timing summary
    runs-on: ubuntu-latest
    needs:
      - test-portable-gambit
      - test-portable-cyclone
      - test-portable-extra-hosts
      - test-emacs-hosted
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Download shard logs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-log-*
          path: ci-logs
          merge-multiple: true

      - name: Render combined timing summary
        shell: bash
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n' 'No shard logs were available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          summary_file=ci-logs/test-shard-summary.md
          : > "$summary_file"
          AGENT_SCHEME_CI_SUMMARY_FILE="$summary_file" emacs -Q --batch -L lisp \
            --eval "(require 'agent-scheme-ci)" \
            --funcall agent-scheme-ci-summary-batch-main -- "${logs[@]}"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare pull request timing comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AGENT_SCHEME_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p ci-logs
          logs=()
          while IFS= read -r -d '' log; do
            logs+=("$log")
          done < <(find ci-logs -type f -name '*.log' -print0)
          if [ "${#logs[@]}" -eq 0 ]; then
            printf '%s\n\n%s\n' '<!-- agent-scheme-ci-timing-summary -->' 'No shard logs were available.' > ci-logs/pr-timing-summary.md
            exit 0
          fi
          AGENT_SCHEME_CI_PR_SUMMARY_FILE=ci-logs/pr-timing-summary.md emacs -Q --batch -L lisp \
            --eval "(require 'agent-scheme-ci)" \
            --funcall agent-scheme-ci-pr-summary-batch-main -- "${logs[@]}"

      - name: Publish pull request timing comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_SCHEME_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- agent-scheme-ci-timing-summary -->'
          comment_file=ci-logs/pr-timing-summary.md
          if [ ! -s "$comment_file" ]; then
            printf '%s\n\nNo shard timing summary was available.' "$marker" > "$comment_file"
          fi
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${AGENT_SCHEME_PR_NUMBER}/comments" \
            --paginate \
            --jq '.[] | select(.body | contains("<!-- agent-scheme-ci-timing-summary -->")) | .id' \
            | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --field "body=@${comment_file}" \
              --silent
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${AGENT_SCHEME_PR_NUMBER}/comments" \
              --field "body=@${comment_file}" \
              --silent
          fi

  live-local-model:
    name: live local model smoke
    runs-on: ubuntu-latest

    env:
      AGENT_SCHEME_LIVE_MODEL_ENDPOINT: http://127.0.0.1:11434/v1
      AGENT_SCHEME_LIVE_MODEL_ID: qwen2.5-coder:0.5b
      OLLAMA_VERSION: 0.24.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl emacs-nox zstd

      - name: Cache Ollama models
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ${{ runner.os }}-ollama-qwen25-coder-05b-v1

      - name: Install Ollama
        run: |
          curl -fsSL "https://ollama.com/download/ollama-linux-amd64.tar.zst?version=${OLLAMA_VERSION}" \
            | zstd -d \
            | sudo tar -xf - -C /usr/local
          ollama --version

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull smoke model
        run: ollama pull "$AGENT_SCHEME_LIVE_MODEL_ID"

      - name: Run live local model smoke
        run: make test-live-model-ci

      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log
