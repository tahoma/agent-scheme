version = 1

# Source files (.el, .sld, .scm, .sh) carry inline SPDX headers. This file
# supplies the same Apache-2.0 licensing for documentation, skill manifests,
# build, and configuration files where an inline header is impractical or
# undesirable. Future vendored third-party material must instead carry its own
# upstream license via an inline SPDX header or a dedicated annotation here
# (see docs/licensing.md).

[[annotations]]
path = [
  "**/*.md",
  ".gitattributes",
  "Makefile",
  ".gitignore",
  "NOTICE",
  ".github/pull_request_template.md",
  ".github/workflows/test.yml",
  ".github/workflows/release.yml",
  ".github/workflows/branding.yml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tahoma Toelkes"
SPDX-License-Identifier = "Apache-2.0"

# The logo PNG is a derived binary (regenerated from consent-logo.svg via
# rsvg-convert; see docs/assets/README.md), so it cannot carry an inline SPDX
# header. The SVG source carries its own inline header.
[[annotations]]
path = ["docs/assets/consent-logo.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tahoma Toelkes"
SPDX-License-Identifier = "Apache-2.0"

# Pinned Unicode Character Database inputs used by the generated portable
# character tables. The generated Scheme file carries the same upstream SPDX
# metadata inline.
[[annotations]]
path = ["vendor/unicode/17.0.0/*.txt"]
precedence = "override"
SPDX-FileCopyrightText = "1991-2025 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# Vendored SRFI 180 fixture corpus from
# https://github.com/scheme-requests-for-implementation/srfi-180 at
# 671857bac55c53e3190a24ec53b457321a1d8f12. The JSON fixtures are the
# upstream `srfi/files` corpus covered by its bundled MIT notice.
[[annotations]]
path = [
  "fixtures/srfi-180/files/*.json",
  "fixtures/srfi-180/files/*.scm",
  "fixtures/srfi-180/files/LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 Nicolas Seriot"
SPDX-License-Identifier = "MIT"

# JSON Lines samples in the SRFI 180 corpus are extracted from python-jsonlines.
[[annotations]]
path = ["fixtures/srfi-180/files/*.jsonl"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 Wouter Bolsterlee"
SPDX-License-Identifier = "BSD-3-Clause"

# JSON Text Sequences samples in the SRFI 180 corpus are from json-text-sequence.
[[annotations]]
path = ["fixtures/srfi-180/files/*.log"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 Joe Hildebrand"
SPDX-License-Identifier = "MIT"

# Vendored SRFI 27 confidence tests from
# https://github.com/scheme-requests-for-implementation/srfi-27 at
# a547c5508d648c61e73bebed2bcd2283fba5abaa.
[[annotations]]
path = ["fixtures/srfi-27/reference/conftest.scm"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2002 Sebastian Egner"
SPDX-License-Identifier = "MIT"

# Vendored SRFI specification snapshots from https://srfi.schemers.org/.
# The individual HTML files include their upstream copyright and MIT-style
# permission notices; this aggregate annotation supplies REUSE metadata for
# snapshots that do not carry machine-readable SPDX headers.
[[annotations]]
path = ["scheme/stdlib/reference/srfi-*/*.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "SRFI document authors"
SPDX-License-Identifier = "MIT"

# Vendored R7RS-large report and ballot snapshots from the official
# https://codeberg.org/scheme/r7rs repository. These files use the Scheme report
# copying permission recorded in the upstream LICENCE.txt snapshot and mirrored
# in LICENSES/LicenseRef-R7RS-Report-Permission.txt.
[[annotations]]
path = [
  "scheme/stdlib/reference/r7rs-large/2016-07-red-edition-report.md",
  "scheme/stdlib/reference/r7rs-large/2019-02-tangerine-edition-report.md",
  "scheme/stdlib/reference/r7rs-large/2022-02-yellow-edition-report.txt",
  "scheme/stdlib/reference/r7rs-large/LICENCE.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "Scheme Working Groups and Scheme report contributors"
SPDX-License-Identifier = "LicenseRef-R7RS-Report-Permission"
